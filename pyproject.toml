[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "runtoolsio"
authors = [{name = "Stan Svec", email = "dev@stansvec.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.12"
dynamic = ["version", "description"]
dependencies = [
    "runtoolsio-runcore>=0.3.0b2,<0.4",
    "runtoolsio-runjob>=0.3.0b2,<0.4",
    "runtoolsio-runcli>=0.3.0b2,<0.4",
    "runtoolsio-taro>=0.3.0b2,<0.4",
]

[project.optional-dependencies]
cli = ["runtoolsio-runcli>=0.3.0b2,<0.4"]
ops = ["runtoolsio-taro>=0.3.0b2,<0.4"]
core = ["runtoolsio-runcore>=0.3.0b2,<0.4"]
job = ["runtoolsio-runjob>=0.3.0b2,<0.4"]
postgres = ["runtoolsio-runcore[postgres]>=0.3.0b2,<0.4"]
s3 = ["runtoolsio-runcore[s3]>=0.3.0b2,<0.4"]

[project.scripts]
run = "runtools.runcli:main_cli"
taro = "runtools.taro.main:run"

[tool.flit.module]
name = "runtools"

[project.urls]
Home = "https://github.com/runtoolsio/runtools"
